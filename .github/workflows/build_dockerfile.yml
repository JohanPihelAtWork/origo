name: Build and Push Docker Image

on:
  push:
    branches: [ 'pr-*', 'main', 'master' ]

# GITHUB_TOKEN behöver skrivbehörighet för att pusha till GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # För att få tillgång till all historik

      # Felsökning: visa vad som faktiskt ligger i repot efter checkout
      - name: Verifiera Dockerfile
        run: |
          pwd
          ls -la
          ls -la Dockerfile || echo "INGEN Dockerfile i roten!"

      - name: Logga in till GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg Docker-bild
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          # Ändra denna sökväg om Dockerfilen ligger i en underkatalog:
          DOCKERFILE_PATH: ./Dockerfile
        run: |
          # GHCR kräver gemener och tags får inte innehålla "/"
          SAFE_TAG=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')
          echo "Bygger bild med tag: $SAFE_TAG"
          docker build -t ghcr.io/johanpihelatwork/origo:$SAFE_TAG -f "$DOCKERFILE_PATH" .
          echo "SAFE_TAG=$SAFE_TAG" >> "$GITHUB_ENV"

      - name: Push Docker-bild till GHCR
        run: |
          docker push ghcr.io/johanpihelatwork/origo:${{ env.SAFE_TAG }}