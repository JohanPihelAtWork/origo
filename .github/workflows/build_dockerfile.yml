name: Build and Push Docker Image

on:
  push:
    branches: [ 'pr-*', 'main', 'master' ]

# GITHUB_TOKEN behöver skrivbehörighet för att pusha till GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # För att få tillgång till all historik

      - name: Skapa Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          # Bygg klienten
          FROM node:20-alpine AS build
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci
          COPY . .
          RUN npm run build

          # Serva byggresultatet
          # OBS: origos webpack.copy.js lägger allt (inkl. index.html) i build/
          FROM nginx:alpine
          RUN rm -rf /usr/share/nginx/html/*
          COPY --from=build /app/build/ /usr/share/nginx/html/
          EXPOSE 80
          EOF
          echo "---- Dockerfile skapad: ----"
          cat Dockerfile

      - name: Logga in till GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg Docker-bild
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          DOCKERFILE_PATH: ./Dockerfile
        run: |
          # GHCR kräver gemener och tags får inte innehålla "/"
          SAFE_TAG=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')
          echo "Bygger bild med tag: $SAFE_TAG"
          docker build -t ghcr.io/johanpihelatwork/origo:$SAFE_TAG -f "$DOCKERFILE_PATH" .
          # Verifiera att det som ska finnas faktiskt finns
          docker run --rm ghcr.io/johanpihelatwork/origo:$SAFE_TAG ls /usr/share/nginx/html
          echo "SAFE_TAG=$SAFE_TAG" >> "$GITHUB_ENV"

      - name: Push Docker-bild till GHCR
        run: |
          docker push ghcr.io/johanpihelatwork/origo:${{ env.SAFE_TAG }}