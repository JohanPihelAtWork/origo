name: Build and Push Docker Image

on:
  push:
    branches: [ 'pr-*', 'main', 'master' ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # För att få tillgång till alla historik

      - name: Logga in till GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg Docker-bild
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          docker build -t ghcr.io/johanpihelatwork/origo:$IMAGE_TAG -f Dockerfile .

      - name: Push Docker-bild till GHCR
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          docker push ghcr.io/johanpihelatwork/origo:$IMAGE_TAG