name: Build and Push PR Docker Image

on:
  push:
    branches: [ 'pr-*', 'main', 'master' ]  # Triggers workflow för alla grenar som börjar med "pr-" eller huvudgrenar

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetcher full commit history for proper tagging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          USERNAME= ${{ github.actor }}
          IMAGE_TAG=${{ github.ref_name }}
          docker build -t ghcr.io/$USERNAME/origo:$IMAGE_TAG -f Dockerfile .

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/$USERNAME/origo:$IMAGE_TAG