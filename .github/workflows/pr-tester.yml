# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DEL 2: WORKFLOW-FIL (läggs till i DIN testgren, EN gång)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Skapa filen .github/workflows/pr-tester.yml på testgrenen.
# Obs: workflowen körs från den gren som pushas, så filen måste
# ligga JUST på pr-grenen (eller på default-grenen om du hellre
# vill att den ska vara permanent).
#
#     mkdir -p .github/workflows
#     $EDITOR .github/workflows/pr-tester.yml   ← klistra in nedan

name: Test PR via fork

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TRIGGER: När aktiveras workflowen?
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Eftersom filen ligger i DIN REPO kan vi använda 'push'.
# För push till eget repo gäller inga fork-restriktioner —
# GITHUB_TOKEN får packages:write och kan pusha till GHCR.
#
# Grenfiltret matchar NAMNET på din testgren, inte PR-numret.
# Mönstret 'pr-*' matchar alla grenar som börjar på "pr-",
# t.ex. pr-2374-test eller pr-2400-test.

on:
  push:
    branches:
      - pr-*

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PERMISSIONER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# contents: read  — för att checkout:a koden
# packages: write — krävs för att pusha image till GHCR

permissions:
  contents: read
  packages: write

env:
  # IMAGE_NAME sätts som gemener direkt här; Docker-taggar får
  # inte innehålla versaler och GHCR kräver lowercase.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build PR image from my fork
    runs-on: ubuntu-latest

    steps:
      # ────────────────────────────────────────────────
      # STEP 1: Checkout:a koden
      # ────────────────────────────────────────────────
      # Utan "ref" checkas automatiskt ut den gren som
      # triggerade workflowen — dvs. din pr-2374-test-gren.
      - name: Checkout PR code from my fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 1   # Räcker för docker build; ingen historik behövs

      # ────────────────────────────────────────────────
      # STEP 2: Visa byggkontext (hjälper vid felsökning)
      # ────────────────────────────────────────────────
      - name: Show build context information
        run: |
          echo "=========================================="
          echo "Building ORIGO from my fork (for testing)"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=========================================="

      # ────────────────────────────────────────────────
      # STEP 3: Bygg imagenamn (gemener) + kort SHA
      # ────────────────────────────────────────────────
      # Två saker förbereds här:
      #  a) IMAGE_NAME: ghcr.io/<ägare>/<repo> i gemener
      #  b) SHORT_SHA: de 7 första tecknen i commit-hashen,
      #     för den läsbara sha-taggen
      - name: Prepare image name and short SHA
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "✓ Image name: $(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          echo "✓ Short SHA: ${GITHUB_SHA:0:7}"

      # ────────────────────────────────────────────────
      # STEP 4: Skapa Dockerfile (multi-stage build)
      # ────────────────────────────────────────────────
      # Origo är en statisk webbapp: Node behövs ENDAST för att
      # bygga bundle.js. Därför:
      #   Stage 1 (builder): node:lts-alpine — installerar ALLA
      #     beroenden (inkl. devDependencies! browserify och
      #     uglifyjs som Origo använder för att bygga bundle.js
      #     är devDependencies) och kör npm run build.
      #   Stage 2 (production): nginx:alpine — kopierar bara de
      #     färdiga statiska filerna. Slutimagen blir ~20 MB.
      #
      # Byggprodukterna samlas i /out i builder-staget. Det gör
      # att vi kan använda vanlig shell-logik (2>/dev/null ||
      # true) för valfria kataloger som config/ och plugins/ —
      # COPY i Dockerfile har ingen fallback-syntax, men RUN
      # körs av shell och hanterar det fint.
      #
      # NOTERA: npm-builden sker INUTI Docker-imagens builder-
      # stage. Det innebär att vi inte behöver separata
      # npm-steg i workflowen — allt sker i ett svep, och den
      # som bygger bilden får exakt samma resultat som du.
      #
      # Osäkerhet: Origos "build"-script i package.json kan vara
      # skrivet med olika syntax för Windows/Unix (dokumentationen
      # nämner båda varianterna). Skulle npm run build misslyckas
      # i Linux-runner är det första stället att titta.
      - name: Create Dockerfile for ORIGO
        run: |
          cat > Dockerfile.pr << 'DOCKERFILE'
          # ────────────────────────────────────────────
          # Stage 1: Build (kastas efteråt, ej i slutimagen)
          # ────────────────────────────────────────────
          FROM node:lts-alpine AS builder

          WORKDIR /app

          # Kopiera dependency-manifest FÖRST — då kan Docker
          # cache:a npm-lagret separat från källkoden, och
          # om endast källkod ändras installeras inget om.
          COPY package.json package-lock.json ./

          # Installera ALLA beroenden (även devDependencies —
          # browserify/uglifyjs behövs för att bygga).
          RUN npm ci

          # Kopiera resten av källkoden
          COPY . .

          # Bygg bundle.js + index.html (produktion)
          RUN NODE_ENV=production npm run build

          # Samla byggprodukter i /out.
          # Shell-syntax här TillåTS (RUN körs av sh) till skillnad
          # från COPY, som inte hanterar "2>/dev/null || true".
          RUN mkdir -p /out \
               && cp bundle.js index.html /out/ \
               && (cp -r css img fonts /out/ 2>/dev/null || true) \
               && (cp -r config /out/ 2>/dev/null || true) \
               && (cp -r plugins /out/ 2>/dev/null || true) \
               && test -f /out/bundle.js \
               || (echo "ERROR: bundle.js saknas efter build" && exit 1)

          # ────────────────────────────────────────────
          # Stage 2: Runtime (nginx, ~20 MB)
          # ────────────────────────────────────────────
          FROM nginx:alpine AS production

          # Enda kopieringen som behövs — allt från /out
          COPY --from=builder /out/ /usr/share/nginx/html/

          # Standard-HTTP-port
          EXPOSE 80

          # Kör nginx i förgrunden (krävs av Docker)
          CMD ["nginx", "-g", "daemon off;"]
          DOCKERFILE

          echo "✓ Dockerfile.pr skapad (multi-stage)"

      # ────────────────────────────────────────────────
      # STEP 5: Setup Docker Buildx
      # ────────────────────────────────────────────────
      # Buildx krävs för cache-lager och multi-plattform.
      # Inga parametrar behövs — default-inställningarna räcker.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ────────────────────────────────────────────────
      # STEP 6: Logga in mot GHCR
      # ────────────────────────────────────────────────
      # Eftersom detta är ditt EGA repo räcker GITHUB_TOKEN —
      # inga egna secrets behöver konfigureras!
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────
      # STEP 7: Bygg och pusha Docker-image
      # ────────────────────────────────────────────────
      # Två taggar:
      #   <branch-namn>  — t.ex. "pr-2374-test", flyttas fram
      #                    för varje ny commit på grenen
      #   sha-<7 tecken> — pinnar exakt den commit som byggdes
      #                    (bra för reproducerbarhet)
      - name: Build and push ORIGO Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.pr
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Båda plattformar täcker Intel/AMD-laptops och
          # Apple Silicon (M1/M2/M3). Vill du bygga snabbare,
          # kör endast den plattform du själv sitter på.
          platforms: linux/amd64,linux/arm64

      # ────────────────────────────────────────────────
      # STEP 8: Build-summary på Actions-sidan
      # ────────────────────────────────────────────────
      # Heredoc är citerad ('EOF') så att shell expanderar
      # ingenting — ${{ }}-uttrycken hanteras av GitHub.
      - name: Upload build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## ✅ ORIGO-image byggd från din fork

          **Gren**: `${{ github.ref_name }}`
          **Commit**: `${{ github.sha }}`
          **Image**: `${{ env.IMAGE_NAME }}`

          ### Testa lokalt

          ```bash
          docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker run --rm -p 8080:80 ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          ```

          Därefter: http://localhost:8080
          EOF
          echo "✓ Build summary uploaded"